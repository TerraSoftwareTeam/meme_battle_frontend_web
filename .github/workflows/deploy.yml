name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/terrasoftwareteam/meme_battle_frontend_web/web
          tags: |
            type=sha,format=short

      - name: Build and push x86_64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, hackclub]
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p /home/deployer/meme_battle_frontend_web
          test -f docker-compose.yml

      - name: Sync deploy files
        run: |
          cp docker-compose.yml /home/deployer/meme_battle_frontend_web/docker-compose.yml

      - name: Write production .env
        working-directory: /home/deployer/meme_battle_frontend_web
        env:
          APP_IMAGE_NAME: ghcr.io/terrasoftwareteam/meme_battle_frontend_web/web
          APP_EXTERNAL_PORT: ${{ vars.APP_EXTERNAL_PORT || '8085' }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat > .env <<EOF
          APP_IMAGE_NAME=${APP_IMAGE_NAME}
          APP_IMAGE_TAG=sha-${SHORT_SHA}

          APP_EXTERNAL_PORT=${APP_EXTERNAL_PORT}
          EOF

          chmod 600 .env

      - name: Login to GHCR with GITHUB_TOKEN
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull new image
        run: docker compose -f /home/deployer/meme_battle_frontend_web/docker-compose.yml pull

      - name: Restart app
        run: docker compose -f /home/deployer/meme_battle_frontend_web/docker-compose.yml up -d
